name = "sebaspresent"
main = "server/worker.js"
compatibility_date = "2025-01-01"

# CORS — allow your Pages domain to call the Worker
# In dev, allow localhost. Add your real Pages URL after first deploy.
[vars]
ALLOWED_ORIGINS = "http://localhost:8080,http://127.0.0.1:8080,https://sebaspresent.pages.dev"
# Sesión 52 — PLAN GRATIS (el usuario canceló el de pago el 17 oct). Tope
# diario propio (server/lib/budget.js) por debajo de lo gratis de D1
# (5 M lecturas y 100 k escrituras al día): el juego se corta solo antes
# ("El servidor descansa") y nunca hay cobros. Uso real: ~30 k / 3 k al día.
CAP_READS = "4500000"
CAP_WRITES = "90000"

[[d1_databases]]
binding = "DB"
database_name = "sebaspresent-db"
database_id = "bd9c29c7-493d-4ece-ac6e-6f97d49558b9"

# JWT_SECRET is set as a secret via:
#   npx wrangler secret put JWT_SECRET
# Locally it's read from .dev.vars

[triggers]
crons = ["* * * * *"]

# Sesión 50 — tiempo real (WebSocket) con un Durable Object (plan gratuito:
# clases SQLite). Ver server/realm.js.
[[durable_objects.bindings]]
name = "REALM"
class_name = "Realm"

[[migrations]]
tag = "v1-realm"
new_sqlite_classes = ["Realm"]
